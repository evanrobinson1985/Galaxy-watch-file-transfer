name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build phone and watch APKs (GitHub edition, plus a Play edition preview)
        run: ./gradlew --no-daemon :mobile:assembleGithubDebug :mobile:assemblePlayDebug :wear:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp mobile/build/outputs/apk/github/debug/mobile-github-debug.apk out/WatchApkInstaller-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk out/WatchApkInstaller-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WatchApkInstaller-apks
          path: out/*.apk

      # The Play edition's features, signed with the shared debug key so it installs over the
      # GitHub edition (handy for store screenshots). Not part of the GitHub release.
      - name: Collect Play edition preview
        run: |
          mkdir -p preview
          cp mobile/build/outputs/apk/play/debug/mobile-play-debug.apk preview/WatchApkInstaller-phone-PLAY-PREVIEW.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WatchApkInstaller-play-preview
          path: preview/*.apk

  # Google Play edition: release App Bundles for the phone and the watch, signed with the
  # upload key from repository secrets. Without the secrets it still builds them (unsigned)
  # to prove the Play edition compiles and passes R8 and lint.
  play:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Play bundles
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :mobile:bundlePlayRelease :wear:bundleRelease

      # The phone finds the watch app through its Wear OS capability list; make sure release
      # resource shrinking didn't strip it from the watch bundle.
      - name: Check watch bundle keeps its Wear OS capability
        run: |
          unzip -p wear/build/outputs/bundle/release/wear-release.aab base/resources.pb \
            | grep -a -q android_wear_capabilities \
            || { echo "::error::android_wear_capabilities missing from the watch bundle"; exit 1; }
          echo "OK: android_wear_capabilities present"

      - name: Collect bundles
        run: |
          mkdir -p play
          cp mobile/build/outputs/bundle/playRelease/mobile-play-release.aab play/WatchApkInstaller-phone.aab
          cp wear/build/outputs/bundle/release/wear-release.aab play/WatchApkInstaller-watch.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: WatchApkInstaller-play-bundles
          path: play/*.aab

  # Publishes each version as a GitHub Release with plain APK downloads, which the phone app's
  # updater checks (releases/latest). Re-pushing the same version refreshes that release's APKs.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/compassionate-cerf-6vyynb')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WatchApkInstaller-apks
          path: out

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep '^appVersionCode=' gradle.properties | cut -d= -f2)
          NAME=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          TAG="v$NAME"
          # The app reads "versionCode: N" from the first line of the notes.
          { echo "versionCode: $CODE"; echo; git log -1 --pretty=%B; } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" out/*.apk --title "Watch APK Installer $NAME" \
              --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
