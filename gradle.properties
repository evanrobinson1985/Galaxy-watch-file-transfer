org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Shared by the phone and watch apps. The phone app bundles the watch app and uses this
# to tell whether the watch has an older version. The watch app's versionCode is this plus
# wearVersionCodeOffset, because Google Play needs a different code for each form factor.
appVersionCode=13
appVersionName=9.0
wearVersionCodeOffset=100000
